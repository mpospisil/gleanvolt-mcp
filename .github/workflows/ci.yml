# The gate a pull request has to pass: the solution builds, and every test in it runs green.
# Nothing here talks to a Gleanvolt installation - the suite is offline by design, so CI needs
# no secrets and a fork's pull request can be validated exactly like a branch of this repo.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A push to a branch supersedes whatever was still running for its earlier commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Gleanvolt.Mcp.slnx and net10.0 both need the 10 SDK; the patch line floats.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Gleanvolt.Mcp.slnx

      - name: Build
        run: dotnet build Gleanvolt.Mcp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Gleanvolt.Mcp.slnx --configuration Release --no-build --logger "console;verbosity=normal"
